[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers
markers =
    slow: tests that load models or hit the network
    integration: tests requiring a running Qdrant
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio.*
