# Full stack: Qdrant + FastAPI + Next.js behind one compose file.
#
#   docker compose up -d          start everything
#   docker compose logs -f api    follow backend logs
#
# The API image bakes in the embedding and reranker models at build time so the
# container does not download ~500MB on first request — a cold start that slow
# looks like a hang to anyone visiting the deployed URL.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: hhg-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      # Qdrant images ship without curl/wget, so probe with bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hhg-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Inside the compose network Qdrant resolves by service name.
      QDRANT_URL: http://qdrant:6333
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-msmarco_xi}
      CORS_ORIGINS: '["http://localhost:3000","${PUBLIC_ORIGIN:-http://localhost:3000}"]'
      RATE_LIMIT_ENABLED: "true"
      HF_HOME: /models
    volumes:
      - model_cache:/models
      - ./data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked at build time: Next.js inlines NEXT_PUBLIC_* into the client
        # bundle, so setting it only at runtime would leave the browser
        # calling the wrong host.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    container_name: hhg-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  qdrant_data:
  model_cache:
